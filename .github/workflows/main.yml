name: Continuous Integration & Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (Black, Flake8 & ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      - name: Run Black check
        run: black --check .

      - name: Run Flake8 check
        run: flake8 .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run JavaScript lint
        run: npm run lint:js

  frontend-test:
    name: Frontend tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:js

  backend-test:
    name: Backend tests
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: music_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          USE_DOCKER: false
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/music_platform
          REDIS_HOST: localhost
          SECRET_KEY: ci-test-key
          LASTFM_KEY: test-key
          DEBUG: true
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/music_platform
        run: |
          export DJANGO_SETTINGS_MODULE=music_project.settings.test
          python manage.py migrate

      - name: Run backend tests
        env:
          USE_DOCKER: false
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/music_platform
          REDIS_HOST: localhost
          SECRET_KEY: ci-test-key
          LASTFM_KEY: test-key
          DEBUG: true
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/music_platform
        run: |
          export DJANGO_SETTINGS_MODULE=music_project.settings.test
          pytest -v --cov=music_api --cov=users

  build_and_push:
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    needs: [lint, frontend-test, backend-test]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER }}/music_project:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build_and_push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deployment
        run: |
          echo "🚀 Отправляем сигнал на Render..."
          curl -f "${{ secrets.RENDER_DEPLOY_HOOK }}"
